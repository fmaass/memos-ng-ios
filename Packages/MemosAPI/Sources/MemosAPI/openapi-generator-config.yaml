# The client is generated, never hand-written: the server contract is memos-ng's openapi.json and
# a hand-written client is a second, silently drifting copy of it.
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic

# WHY A FILTER AT ALL. This generator version answers a schema it cannot express by emitting
# nothing: `MapManifest.planet` and `.detail`, written upstream as `anyOf: [{$ref: MapArchive},
# {"type": "null"}]`, come back as `warning: Schema "null" is not supported … skipping` and the
# properties are simply absent from the generated type. A client built on that would carry two
# fields that are always nil, which is worse than not having them. Those two properties exist only
# on the manifest of a self-hosted basemap this app does not read — it draws its map with the
# platform's own map view and reaches the household's map data through the markers operation — so
# the whole basemap surface is left ungenerated rather than half-generated. The contract itself is
# vendored VERBATIM and stays byte-identical; the fix for the idiom belongs upstream, never here.
#
# HOW THIS LIST IS MAINTAINED. The generator's filter is inclusion-only, so what this list does not
# name is not generated and no build goes red about it. The list is therefore DERIVED, not curated:
# it is every operationId in the vendored document minus the four basemap operations —
# `basemap_manifest_api_map_manifest_get`, `serve_basemap_archive_api_map_tiles__name__get`, its
# `…__head`, and `serve_basemap_asset_api_map_assets__path__get`. After a re-vendor, re-derive it;
# `scripts/openapi-coverage-rule.sh` holds the subtraction to that, names every operation that
# would otherwise be dropped in silence, and carries the four exclusions with their reason.
# Schemas need no listing: the generator includes the transitive closure of what these operations
# reference.
filter:
  operations:
    - add_digest_recipient_api_admin_digest_recipients_post
    - append_chunk_api_uploads__upload_uid__patch
    - attach_rendition_api_attachments__uid__renditions_post
    - attachment_meta_api_attachments__uid__get
    - create_memo_api_memos_post
    - create_pat_api_pats_post
    - delete_attachment_api_attachments__uid__delete
