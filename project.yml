# Local overrides merge in order; later entries win, and this file wins over includes for any
# key set here — which is why signing keys are NOT set here (see signing.default.yml).
include:
  - path: signing.default.yml
  - path: signing.local.yml    # per-machine; bin/generate.sh stubs it when absent (xcodegen has no optional includes)

# The Xcode project is generated from this file; MemosNG.xcodeproj is not committed.
#
# A hand-maintained .xcodeproj is an opaque, merge-hostile artefact: the agents that write this
# code work on a Linux machine and cannot author or review one, and two people touching the same
# project file conflict on generated UUIDs. This file is the project.
name: MemosNG

options:
  bundleIdPrefix: live.discomarder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # A reference project opts into Swift 6 explicitly: new Xcode app projects still default to the
    # Swift 5 language mode, and "strict concurrency later" never happens.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # MainActor by default is right for the UI layers and wrong for the API layer, whose middleware
    # is called off the main actor by the transport — so it is opted into per target, not globally.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MemosAPI:
    path: Packages/MemosAPI
  MemosCore:
    path: Packages/MemosCore
  MemosFeatures:
    path: Packages/MemosFeatures
  MemosOutbox:
    path: Packages/MemosOutbox
  # What the share extension does with what the system hands it. It lives in a package because an
  # Xcode test bundle cannot link an .appex: logic left in the extension target is untestable.
  MemosShareKit:
    path: Packages/MemosShareKit
  # The test bundles substitute the transport and build requests by hand, so they reference these
  # two modules directly and Xcode has to be told to link them. Keep the versions in step with
  # Packages/MemosAPI/Package.swift — SwiftPM resolves one graph and will refuse a conflict.
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.12.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: 1.6.0

# Every test bundle is hosted in the app. Two reasons, both learned the hard way: a host-less
# unit-test bundle has no keychain entitlement in the simulator (the Keychain round trip fails with
# errSecMissingEntitlement), and mixing hosted and host-less bundles makes them fight over the
# shared PackageFrameworks directory until one of them fails to link.
targets:
  MemosNG:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MemosNG
    dependencies:
      - package: MemosFeatures
      - package: MemosCore
      - package: MemosOutbox
      # Linked, not imported: composing a SessionStore inlines its default client factory, which
      # lives in MemosAPI, so the app has to link it even though it never says `import MemosAPI`.
      - package: MemosAPI
      # Embeds the share extension into the app bundle. The two share the app group, and nothing
      # else: the extension has no client, no session and no credential.
      - target: MemosShare
    # Generated by XcodeGen into MemosNG.entitlements — no team id anywhere: associated domains
    # name only the DOMAIN, the app-group name is used verbatim as the keychain namespace, and
    # the AASA file on the server is what carries the team id. The ?mode=developer entry bypasses
    # Apple's AASA CDN (and its cached-failure trap) on devices with Associated Domains
    # Development enabled — a development aid, not the production path.
    entitlements:
      path: MemosNG.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:memos.discomarder.live
          - webcredentials:memos.discomarder.live?mode=developer
        com.apple.security.application-groups:
          - group.live.discomarder.memosng
    # Two keys have no INFOPLIST_KEY_ build setting to express them, so they live in a generated
    # plist that the INFOPLIST_KEY_ values below are merged into. The file is generated from THIS
    # spec (and gitignored) — it is not a hand-maintained Info.plist coming back through the door.
    info:
      path: Support/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - live.discomarder.memosng.outbox-refresh
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng
        PRODUCT_NAME: MemosNG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: memosng
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # The app declared no version at all until it had an extension. It has to now: an
        # extension's CFBundleVersion must match its containing app's, and these two settings are
        # where GENERATE_INFOPLIST_FILE reads both version keys from. Move them together with the
        # matching pair on MemosShare, never one alone.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The household DNS resolves the server to a private LAN address (split-horizon), so iOS
        # classifies API calls as Local Network access; without this declaration iOS 18+ denies
        # them silently (NSURLError -1009 with a satisfied path).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Memos connects to your memos-ng server, which may live on your local network.
        # Signing lives in signing.default.yml (committed, ad-hoc, simulator-only) overridden by
        # signing.local.yml (gitignored, per-machine device team) — see the include list at the
        # top of this file. Never set signing here and never click it into the generated project.

  # The share sheet. It persists a capture into the app group's outbox and returns: the app owns
  # the one background upload session — two processes cannot share it — so an extension that
  # uploaded would race its own host and lose the transfer when the sheet closes.
  MemosShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MemosShare
    dependencies:
      - package: MemosShareKit
      - package: MemosOutbox
    # The app group ONLY. No keychain access group: the extension never needs the token — the
    # account a capture is bound to is published beside the queue by the app (OutboxAccountStore),
    # and an extension that cannot read a credential is one that cannot leak it.
    entitlements:
      path: MemosShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.live.discomarder.memosng
    # NSExtension has no INFOPLIST_KEY_ equivalent, so it lives in a generated plist the
    # INFOPLIST_KEY_ values below are merged into — same arrangement as the app's.
    info:
      path: Support/MemosShare-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.share
        PRODUCT_NAME: MemosShare
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: memosng
        # Not decoration: GENERATE_INFOPLIST_FILE writes CFBundleVersion and
        # CFBundleShortVersionString from these two and from nothing else, and an extension
        # without a bundle version cannot be installed at all — "bundleVersion must be set in
        # placeholder attributes for an app extension placeholder", which is a failure to
        # INSTALL the host app, not a warning about the extension.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  MemosAPITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosAPI/Tests/MemosAPITests
    dependencies:
      - package: MemosAPI
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.apitests

  MemosCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosCore/Tests/MemosCoreTests
      # The parity fixture is vendored next to openapi.json from one memos-ng commit and read out
      # of this bundle at run time.
      - path: Packages/MemosAPI/Sources/MemosAPI/Fixtures/markdown-parity.json
        buildPhase: resources
    dependencies:
      - package: MemosCore
      - package: MemosAPI
      - package: MemosOutbox
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.coretests

  MemosOutboxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosOutbox/Tests/MemosOutboxTests
      # The outbox hand-rolls its transport (the chunk PATCH and the offset HEAD cannot be
      # generated), so the contract it hand-rolls against is read out of this bundle at run time
      # and asserted — vendored from ONE memos-ng commit, same as the parity fixture.
      - path: Packages/MemosAPI/Sources/MemosAPI/openapi.json
        buildPhase: resources
    dependencies:
      - package: MemosOutbox
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.outboxtests

  MemosShareKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosShareKit/Tests/MemosShareKitTests
    dependencies:
      - package: MemosShareKit
      - package: MemosOutbox
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.sharekittests

  MemosFeaturesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosFeatures/Tests/MemosFeaturesTests
    dependencies:
      - package: MemosFeatures
      - package: MemosCore
      - package: MemosOutbox
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.featurestests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  MemosNG:
    build:
      targets:
        MemosNG: all
        MemosAPITests: [test]
        MemosCoreTests: [test]
        MemosOutboxTests: [test]
        MemosFeaturesTests: [test]
        MemosShareKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MemosAPITests
        - MemosCoreTests
        - MemosOutboxTests
        - MemosFeaturesTests
        - MemosShareKitTests
