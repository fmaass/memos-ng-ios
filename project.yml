# Local overrides merge in order; later entries win, and this file wins over includes for any
# key set here — which is why signing keys are NOT set here (see signing.default.yml).
include:
  - path: signing.default.yml
  - path: signing.local.yml    # per-machine; bin/generate.sh stubs it when absent (xcodegen has no optional includes)

# The Xcode project is generated from this file; MemosNG.xcodeproj is not committed.
#
# A hand-maintained .xcodeproj is an opaque, merge-hostile artefact: the agents that write this
# code work on a Linux machine and cannot author or review one, and two people touching the same
# project file conflict on generated UUIDs. This file is the project.
name: MemosNG

options:
  bundleIdPrefix: live.discomarder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # A reference project opts into Swift 6 explicitly: new Xcode app projects still default to the
    # Swift 5 language mode, and "strict concurrency later" never happens.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # MainActor by default is right for the UI layers and wrong for the API layer, whose middleware
    # is called off the main actor by the transport — so it is opted into per target, not globally.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MemosAPI:
    path: Packages/MemosAPI
  MemosCore:
    path: Packages/MemosCore
  MemosFeatures:
    path: Packages/MemosFeatures
  MemosOutbox:
    path: Packages/MemosOutbox
  # What the share extension does with what the system hands it. It lives in a package because an
  # Xcode test bundle cannot link an .appex: logic left in the extension target is untestable.
  MemosShareKit:
    path: Packages/MemosShareKit
  # The test bundles substitute the transport and build requests by hand, so they reference these
  # two modules directly and Xcode has to be told to link them. Keep the versions in step with
  # Packages/MemosAPI/Package.swift — SwiftPM resolves one graph and will refuse a conflict.
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.12.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: 1.6.0
  # The Features test bundle projects what the RENDERER parsed, so it builds a `MarkdownContent`
  # itself and has to link MarkdownUI directly. Keep the version in step with
  # Packages/MemosFeatures/Package.swift — SwiftPM resolves one graph and will refuse a conflict.
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.0.0

# Every test bundle is hosted in the app. Two reasons, both learned the hard way: a host-less
# unit-test bundle has no keychain entitlement in the simulator (the Keychain round trip fails with
# errSecMissingEntitlement), and mixing hosted and host-less bundles makes them fight over the
# shared PackageFrameworks directory until one of them fails to link.
targets:
  MemosNG:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MemosNG
      # Apple reads the privacy manifest from the bundle ROOT, under exactly this name, so each
      # target needs its own directory holding a file called PrivacyInfo.xcprivacy — a resource
      # build phase copies it flat, and it cannot be renamed on the way in.
      - path: Support/MemosNG/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MemosFeatures
      - package: MemosCore
      - package: MemosOutbox
      # Linked, not imported: composing a SessionStore inlines its default client factory, which
      # lives in MemosAPI, so the app has to link it even though it never says `import MemosAPI`.
      - package: MemosAPI
      # Embeds the share extension into the app bundle. The two share the app group, and nothing
      # else: the extension has no client, no session and no credential.
      - target: MemosShare
    # Generated by XcodeGen into MemosNG.entitlements — no team id anywhere: associated domains
    # name only the DOMAIN, the AASA file on the server is what carries the team id, and the one
    # group that does need a team prefix takes it from $(AppIdentifierPrefix), which Xcode expands
    # when it processes this file. The ?mode=developer entry bypasses Apple's AASA CDN (and its
    # cached-failure trap) on devices with Associated Domains Development enabled — a development
    # aid, not the production path.
    #
    # keychain-access-groups is where the device token lives, and this target is the ONLY one that
    # has it. An app group identifier is itself a keychain access group on iOS, so while the token
    # sat in group.live.discomarder.memosng every extension entitled to that container — the share
    # extension — could read it. It has a group of its own now, and the extension has no way to
    # name it. Being FIRST in this list also makes it the default access group, which is what the
    # runtime probe reads back to prove the entitlement reached the running build.
    entitlements:
      path: MemosNG.entitlements
      properties:
        com.apple.developer.associated-domains:
          # applinks is what lets the server's own https callback OPEN this app. It is not
          # implied by webcredentials: the old sign-in used an ASWebAuthenticationSession, whose
          # .https callback rides on webcredentials, and that hid the omission for as long as it
          # lasted. The app presents the browser view itself now, so the return trip is an
          # ordinary universal link and needs the ordinary entitlement. The server's AASA already
          # declares /ios/auth/callback* for this app id.
          #
          # It is not sufficient either, and in this deployment it is not even reachable: the
          # association is published through Apple's CDN, and this server is on internal-only
          # DNS, so the CDN can never fetch it. The universal-link lane is permanently inert
          # here. That is what the custom URL scheme below is for. This entry stays because it
          # is one line and it is what would make the better lane start working, with nothing to
          # ship for it, if a publicly fetchable AASA is ever served for the domain.
          - applinks:memos.discomarder.live
          - applinks:memos.discomarder.live?mode=developer
          - webcredentials:memos.discomarder.live
          - webcredentials:memos.discomarder.live?mode=developer
        com.apple.security.application-groups:
          - group.live.discomarder.memosng
        keychain-access-groups:
          # EXACTLY ONE ENTRY, and it is the DEFAULT access group — the one an unqualified add
          # lands in — which the runtime probe reads back to decide which namespace the token
          # lives in. The app group is deliberately NOT listed here: iOS provisioning validates
          # every keychain-access-groups entry against the profile's `TEAMID.*` pattern, and a
          # raw `group.…` entry can never match it, so naming the migration source here broke
          # automatic signing on device builds outright (simulator gates never see provisioning).
          # The app's keychain access to `group.live.discomarder.memosng` rides on the
          # application-groups entitlement above — the documented mechanism, relied on by the
          # migration read and verified on device by the runtime probe.
          - "$(AppIdentifierPrefix)live.discomarder.memosng.credentials"
    # Two keys have no INFOPLIST_KEY_ build setting to express them, so they live in a generated
    # plist that the INFOPLIST_KEY_ values below are merged into. The file is generated from THIS
    # spec (and gitignored) — it is not a hand-maintained Info.plist coming back through the door.
    info:
      path: Support/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - live.discomarder.memosng.outbox-refresh
        # The sign-in's return lane — the only one that can fire in this deployment, because the
        # universal link above needs an association Apple's CDN cannot fetch from internal-only
        # DNS. The callback page the server serves carries a link on exactly this scheme and host
        # (memosng://auth-callback, with whatever query the page was given), and a tap on it
        # reaches the app with no domain association involved at all. Any app on the phone could
        # claim the same scheme, so nothing that crosses it is trusted for being on it — what
        # crosses it is a one-shot handoff code that is worthless without the PKCE verifier, and
        # the verifier never leaves this process.
        CFBundleURLTypes:
          - CFBundleURLName: live.discomarder.memosng.auth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - memosng
        UIBackgroundModes:
          - fetch
        # The export-compliance answer, given once here so App Store Connect stops asking it on
        # every upload. It is a real boolean, which is why it lives in this block and not in an
        # INFOPLIST_KEY_ setting: build settings are strings, and this key is read as a Boolean.
        # NO is the truthful answer — the app's only cryptography is HTTPS through the system's
        # own TLS and the keychain, both exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng
        PRODUCT_NAME: MemosNG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: memosng
        # All four, though the family is iPhone-only: App Store validation under the iOS 26 SDK
        # rejects an upload that declares less (error 90474 — the deprecated full-screen opt-out
        # is no longer a way around it; upload-rejected 2026-08-25 with portrait alone). Landscape
        # is also simply right for the media viewer, and SwiftUI lays the rest out.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The app declared no version at all until it had an extension. It has to now: an
        # extension's CFBundleVersion must match its containing app's, and these two settings are
        # where GENERATE_INFOPLIST_FILE reads both version keys from. Move them together with the
        # matching pair on MemosShare, never one alone.
        #
        # 0.1.0 because that is what this is: the first version handed to the household over
        # TestFlight, not a 1.0. The version does not move for a fix to that same version.
        #
        # The build number does. Every number an upload has used is spent — App Store Connect
        # refuses a second upload under a number it already holds — so the pair moves up by one
        # for each build that replaces the last: build 3 is spent, and the fix for a sign-in that
        # comes back incomplete on a retry ships as build 4. This value is what a LOCAL archive
        # uploads under; an Xcode Cloud build is assigned its own auto-incrementing number instead
        # (developer.apple.com/documentation/xcode/setting-the-next-build-number-for-xcode-cloud-builds),
        # exposed to custom build scripts as CI_BUILD_NUMBER ("The number of the current build,
        # for example, 42" — the environment variable reference). See docs/TESTFLIGHT.md for what
        # is verified from Apple's documentation and what is not: the durable fix for a duplicate
        # build number under Xcode Cloud is a ci_scripts/ci_pre_xcodebuild.sh that stamps
        # CURRENT_PROJECT_VERSION from $CI_BUILD_NUMBER, so that no hand edit is needed here.
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "18"
        # The household DNS resolves the server to a private LAN address (split-horizon), so iOS
        # classifies API calls as Local Network access; without this declaration iOS 18+ denies
        # them silently (NSURLError -1009 with a satisfied path).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Memos connects to your memos-ng server, which may live on your local network.
        # The in-app camera. Both strings say what actually happens, because a usage string is the
        # only explanation most people will ever read: the capture goes into the memo being
        # written and up to your own server as the phone's own encoder wrote it, and nothing is
        # kept anywhere else. The microphone is asked for only when a VIDEO is being recorded —
        # taking photos never touches it.
        INFOPLIST_KEY_NSCameraUsageDescription: Memos uses the camera to take a photo or a video for the memo you are writing. It goes to your own memos server exactly as the camera recorded it.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Memos uses the microphone to record the sound of a video you take for a memo. Photos never use it.
        # The system share sheet is handed the downloaded file with no activity excluded
        # (`MediaSaveFlow.swift`, `ShareSheet`), so it offers "Save Image" and "Save Video", and
        # iOS asks this string of any app a photo is added to the library from. ADD-ONLY on
        # purpose, never `NSPhotoLibraryUsageDescription`: the app reads nothing from the library
        # — composing picks through `PhotosPicker`, which needs no key — and asking for less is
        # the point.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Memos saves the photo or video you chose to keep into your photo library. It never reads your library.
        # Signing lives in signing.default.yml (committed, ad-hoc, simulator-only) overridden by
        # signing.local.yml (gitignored, per-machine device team) — see the include list at the
        # top of this file. Never set signing here and never click it into the generated project.

  # The share sheet. It persists a capture into the app group's outbox and returns: the app owns
  # the one background upload session — two processes cannot share it — so an extension that
  # uploaded would race its own host and lose the transfer when the sheet closes.
  MemosShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MemosShare
      # An .appex is its own bundle with its own privacy manifest — the host app's does not
      # cover it. Same flat copy, same mandatory filename, so it needs its own directory.
      - path: Support/MemosShare/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MemosShareKit
      - package: MemosOutbox
    # The app group ONLY, and it buys the CONTAINER: the queued capture files and the identity
    # JSON. No keychain-access-groups entry, which is what keeps the token out of reach — the
    # credential lives in a group named only in the app's entitlements, and a process that cannot
    # name a group cannot read its items. Adding a keychain-access-groups entry here would undo
    # the whole arrangement; the gate greps this pair of generated files for exactly that.
    entitlements:
      path: MemosShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.live.discomarder.memosng
    # NSExtension has no INFOPLIST_KEY_ equivalent, so it lives in a generated plist the
    # INFOPLIST_KEY_ values below are merged into — same arrangement as the app's.
    info:
      path: Support/MemosShare-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
        # Declared in the embedded bundle too, for the same reason the version keys are: the
        # export-compliance check reads the bundles it is given, and an extension that answers
        # differently from its host is a question waiting to be asked. Boolean, so it lives here.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.share
        PRODUCT_NAME: MemosShare
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: memosng
        # Not decoration: GENERATE_INFOPLIST_FILE writes CFBundleVersion and
        # CFBundleShortVersionString from these two and from nothing else, and an extension
        # without a bundle version cannot be installed at all — "bundleVersion must be set in
        # placeholder attributes for an app extension placeholder", which is a failure to
        # INSTALL the host app, not a warning about the extension.
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "18"

  MemosAPITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosAPI/Tests/MemosAPITests
    dependencies:
      - package: MemosAPI
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.apitests

  MemosCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosCore/Tests/MemosCoreTests
      # The parity fixture is vendored next to openapi.json from one memos-ng commit and read out
      # of this bundle at run time.
      - path: Packages/MemosAPI/Sources/MemosAPI/Fixtures/markdown-parity.json
        buildPhase: resources
    dependencies:
      - package: MemosCore
      - package: MemosAPI
      - package: MemosOutbox
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.coretests

  MemosOutboxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosOutbox/Tests/MemosOutboxTests
      # The outbox's hand-rolled wire types are licensed by ONE ground — its dependency rule: the
      # package takes no dependencies, so the generated client is unreachable from it — and only on
      # the condition that a contract test pins every semantic those mirrors consume. That is what
      # this resource is for: the vendored document is read out of the bundle at run time and
      # asserted against — from ONE memos-ng commit, same as the parity fixture.
      - path: Packages/MemosAPI/Sources/MemosAPI/openapi.json
        buildPhase: resources
      # The Auto memo date and the capture order are ONE rule set for every client, and this is
      # where the rule set lives: the artefact vendored from the same memos-ng commit as the
      # document above, with the binaries it names beside it. The vectors and the files are read
      # out of this bundle at run time, so the reader and the vector suites are held to the same
      # artefact the server and the SPA are held to — not to cases copied into Swift.
      - path: Packages/MemosAPI/Sources/MemosAPI/Fixtures/auto-memo-date.json
        buildPhase: resources
      - path: Packages/MemosAPI/Sources/MemosAPI/Fixtures/auto-memo-date
        buildPhase: resources
    dependencies:
      - package: MemosOutbox
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.outboxtests
        # The capture fixtures are VENDORED BYTES, and this bundle checks each one's sha256
        # against the artefact that describes it. Xcode re-encodes PNG resources on the way in —
        # measured on this project 2026-09-06: png-none.png went from 77 bytes to 85 — which
        # rewrites the very files the digests are about, and can move the eXIf chunk whose
        # PLACEMENT one of them exists to test. So the copy is left alone here.
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO

  MemosShareKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosShareKit/Tests/MemosShareKitTests
    dependencies:
      - package: MemosShareKit
      - package: MemosOutbox
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.sharekittests

  MemosFeaturesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/MemosFeatures/Tests/MemosFeaturesTests
      # The parity fixture is vendored next to openapi.json from one memos-ng commit and read out
      # of this bundle at run time, where it is held against the renderer the app ships.
      - path: Packages/MemosAPI/Sources/MemosAPI/Fixtures/markdown-parity.json
        buildPhase: resources
    dependencies:
      - package: MemosFeatures
      - package: MemosCore
      - package: MemosOutbox
      - package: swift-markdown-ui
        product: MarkdownUI
      - target: MemosNG
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: live.discomarder.memosng.featurestests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  MemosNG:
    build:
      targets:
        MemosNG: all
        MemosAPITests: [test]
        MemosCoreTests: [test]
        MemosOutboxTests: [test]
        MemosFeaturesTests: [test]
        MemosShareKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MemosAPITests
        - MemosCoreTests
        - MemosOutboxTests
        - MemosFeaturesTests
        - MemosShareKitTests
